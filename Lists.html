<html>
	<head>
		<title> HTML LISTS</title>
	</head>
	<body>

###ORDERED LIST###
		<ol type="A" reversed>
			<li> HTML</li>
			<li>CSS</li>
			<li>JS</li>

		</ol>
<!--UNORDERED LIST-->
###UNORDERED LIST###

			<li> HTML</li>
			<li>CSS</li>
			<li>JS</li>
		</ul>
<!--DESCRIPTION LIST-->
###DESCRIPTIVE LIST###
		<dl>
			<dt>HTML</dt>
			<dd> Hyper text makeup language</dd>
			<dt>CSS</dt>
			<dd> Cascanding style sheet</dd>
		</dl>
<!--NESTED LIST-->
###NESTED LIST###
		<ul>
			<li>Frontend
		<ol>
			<li>HTML</li
			<li>CSS</li>
			<li>JS</li>
		</ol>
		</li>
			<li>Backend
		<ol>
			<li>JAVA</li>
		</ol>
			</li>

		</ul>
	</body>
</html>
