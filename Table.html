<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>

</head>
<body>
    <h1>HTML Table Tag</h1>
    <table border ="2">
        <caption>Student Marks</caption>

        <colgroup>
            <col style="background-color:rgb(84, 197, 235)">
            <col style="background-color:rgb(189, 225, 11)">
            <col style="background-color:rgb(222, 12, 47)">
        </colgroup>

        <thead>
        <tbody>
        <tr>
            <th>Student Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        </thead>

        <tr>
            <td rowspan="2">Ravi</td>
            <td>HTML</td>
            <td>90</td>
        </tr>
        <tr>
            

            <td>CSS</td>
            <td>87</td>
        </tr>

        <tr>
            <td rowspan="2">Priya</td>
            <td>HTML</td>
            <td>99</td>
        </tr>

        <tr>
            
            <td>CSS</td>
            <td>85</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="2">Total Students</td>
            
            <td>2</td>
        </tr>
        </tfoot>

    </table>
</body>
</html>
